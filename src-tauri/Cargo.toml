[package]
name = "tda-dashboard"
version = "0.43.0"
description = "TDA Dashboard - Team Dev Archive"
authors = ["TDA Team"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# [r61] devtools feature: release 빌드에서도 우클릭 검사/Ctrl+Shift+I·open_devtools() 사용 가능
tauri = { version = "2", features = ["devtools"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# [r60] 시스템 기본 브라우저로 OAuth URL 열기 (데스크톱 로그인)
open = "5"
# [v40 Day3 청크4] OAuth deep-link (tda://auth-callback)
tauri-plugin-deep-link = "2"

# single-instance는 데스크톱 전용 — deep-link feature로 2번째 실행을 기존 창에 라우팅
[target.'cfg(any(target_os = "windows", target_os = "linux", target_os = "macos"))'.dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
# [r59] 자동 업데이트(Claude 앱식 "다시 시작") — 데스크톱 전용
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[features]
# 기본은 dev profile에서만 빠른 빌드
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
