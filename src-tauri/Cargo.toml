[package]
name = "tda-dashboard"
version = "0.40.0"
description = "TDA Dashboard - Team Dev Archive"
authors = ["TDA Team"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# [v40 Day3 청크4] OAuth deep-link (tda://auth-callback)
tauri-plugin-deep-link = "2"

# single-instance는 데스크톱 전용 — deep-link feature로 2번째 실행을 기존 창에 라우팅
[target.'cfg(any(target_os = "windows", target_os = "linux", target_os = "macos"))'.dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

[features]
# 기본은 dev profile에서만 빠른 빌드
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
